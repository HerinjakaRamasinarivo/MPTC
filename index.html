<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPTC Smart Scan</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7a2e3a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#f4f1f2;color:#222}
  header{background:#7a2e3a;color:#fff;padding:14px 16px}
  header b{font-size:20px} header span{display:block;font-size:12px;opacity:.85}
  main{padding:14px;max-width:560px;margin:auto}
  .btn{display:block;width:100%;padding:16px;margin:8px 0;font-size:17px;text-align:center;border:0;border-radius:12px;
       background:#7a2e3a;color:#fff;cursor:pointer}
  .btn.alt{background:#fff;color:#7a2e3a;border:2px solid #7a2e3a}
  .row{display:flex;gap:8px} .row .btn{padding:12px;font-size:15px}
  input[type=file]{display:none}
  #cv{width:100%;touch-action:none;border-radius:8px;background:#ddd;display:block}
  .ctl{font-size:13px;margin:6px 0} .ctl input{width:100%}
  #st{margin:12px 0;font-weight:600}
  table{width:100%;border-collapse:collapse;background:#fff;margin-top:8px}
  td{padding:6px 8px;border-bottom:1px solid #eee;font-size:14px;vertical-align:top}
  td:first-child{color:#777;width:42%}
  .hide{display:none}
</style>
</head>
<body>
<header><b>MPTC Smart Scan</b><span>Scan the form. Data goes straight to the sheet.</span></header>
<main>

  <div id="home">
    <label class="btn">📷 Scan a form<input id="cam" type="file" accept="image/*" capture="environment"></label>
    <label class="btn alt">🖼️ Choose from gallery<input id="gal" type="file" accept="image/*"></label>
  </div>

  <div id="edit" class="hide">
    <canvas id="cv"></canvas>
    <div style="font-size:12px;color:#666;margin:4px 0">Drag on the photo to crop to the form.</div>
    <div class="row">
      <button class="btn alt" onclick="rot(-1)">⟲ Left</button>
      <button class="btn alt" onclick="rot(1)">⟳ Right</button>
      <button class="btn alt" onclick="resetAll()">Reset</button>
    </div>
    <div class="ctl">Brightness <input id="br" type="range" min="0.7" max="1.6" step="0.05" value="1"></div>
    <div class="ctl">Contrast <input id="ct" type="range" min="0.8" max="2" step="0.05" value="1"></div>
    <button class="btn" onclick="send()">✅ Send to Google Sheet</button>
    <button class="btn alt" onclick="back()">Retake</button>
  </div>

  <div id="st"></div>
  <table id="res"></table>
  <button id="next" class="btn hide" onclick="back()">📷 Scan next form</button>
</main>

<script>
  var API_URL = "https://script.google.com/macros/s/AKfycbz7cxHC2O2khXRfUdWtlP51JURkWMrZA15J6XhKHXCx1xljwjoak1dPi3oyH-xTo-hIZw/exec";
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  function getPin(){var p=localStorage.getItem("pin");if(!p){p=prompt("Team PIN");if(p)localStorage.setItem("pin",p);}return p;}
  var MAX = 1280, QUALITY = 0.75;
  var $ = function (id) { return document.getElementById(id); };
  var work = document.createElement('canvas'), orig = null;
  var cv = $('cv'), ctx = cv.getContext('2d');
  var crop = null, drag = null;            // crop = {x0,y0,x1,y1} in 0..1

  function load(file) {
    if (!file) return;
    var img = new Image();
    img.onload = function () {
      var s = Math.min(1, 1800 / Math.max(img.width, img.height));
      orig = document.createElement('canvas');
      orig.width = Math.round(img.width * s); orig.height = Math.round(img.height * s);
      orig.getContext('2d').drawImage(img, 0, 0, orig.width, orig.height);
      resetAll();
      $('home').classList.add('hide'); $('edit').classList.remove('hide');
      $('st').textContent = ''; $('res').innerHTML = ''; $('next').classList.add('hide');
    };
    img.src = URL.createObjectURL(file);
  }
  $('cam').onchange = function () { load(this.files[0]); this.value = ''; };
  $('gal').onchange = function () { load(this.files[0]); this.value = ''; };

  function resetAll() {
    work.width = orig.width; work.height = orig.height;
    work.getContext('2d').drawImage(orig, 0, 0);
    crop = { x0: 0, y0: 0, x1: 1, y1: 1 };
    $('br').value = 1; $('ct').value = 1; draw();
  }

  function rot(dir) {
    var t = document.createElement('canvas');
    t.width = work.height; t.height = work.width;
    var c = t.getContext('2d');
    c.translate(t.width / 2, t.height / 2); c.rotate(dir * Math.PI / 2);
    c.drawImage(work, -work.width / 2, -work.height / 2);
    work.width = t.width; work.height = t.height;
    work.getContext('2d').drawImage(t, 0, 0);
    crop = { x0: 0, y0: 0, x1: 1, y1: 1 }; draw();
  }

  function draw() {
    var w = Math.min(560, document.body.clientWidth - 28), h = Math.round(w * work.height / work.width);
    cv.width = w; cv.height = h; cv.style.height = h + 'px';
    ctx.drawImage(work, 0, 0, w, h);
    var x = crop.x0 * w, y = crop.y0 * h, cw = (crop.x1 - crop.x0) * w, ch = (crop.y1 - crop.y0) * h;
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(0, 0, w, y); ctx.fillRect(0, y + ch, w, h - y - ch);
    ctx.fillRect(0, y, x, ch); ctx.fillRect(x + cw, y, w - x - cw, ch);
    ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 2; ctx.strokeRect(x, y, cw, ch);
    cv.style.filter = 'brightness(' + $('br').value + ') contrast(' + $('ct').value + ')';
  }
  $('br').oninput = draw; $('ct').oninput = draw;

  function pos(e) {
    var r = cv.getBoundingClientRect();
    return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
             y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) };
  }
  cv.onpointerdown = function (e) { drag = pos(e); cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = function (e) {
    if (!drag) return;
    var p = pos(e);
    crop = { x0: Math.min(drag.x, p.x), y0: Math.min(drag.y, p.y), x1: Math.max(drag.x, p.x), y1: Math.max(drag.y, p.y) };
    draw();
  };
  cv.onpointerup = function () {
    drag = null;
    if (crop.x1 - crop.x0 < 0.1 || crop.y1 - crop.y0 < 0.1) { crop = { x0: 0, y0: 0, x1: 1, y1: 1 }; draw(); }
  };

  function send() {
    var sx = crop.x0 * work.width, sy = crop.y0 * work.height;
    var sw = (crop.x1 - crop.x0) * work.width, sh = (crop.y1 - crop.y0) * work.height;
    var s = Math.min(1, MAX / Math.max(sw, sh));
    var o = document.createElement('canvas'); o.width = Math.round(sw * s); o.height = Math.round(sh * s);
    var c = o.getContext('2d'); c.drawImage(work, sx, sy, sw, sh, 0, 0, o.width, o.height);

    var b = parseFloat($('br').value), k = parseFloat($('ct').value);
    if (b !== 1 || k !== 1) {
      var im = c.getImageData(0, 0, o.width, o.height), d = im.data;
      for (var i = 0; i < d.length; i += 4) for (var j = 0; j < 3; j++) {
        var v = d[i + j] * b; v = (v - 128) * k + 128; d[i + j] = v < 0 ? 0 : v > 255 ? 255 : v;
      }
      c.putImageData(im, 0, 0);
    }
    var b64 = o.toDataURL('image/jpeg', QUALITY).split(',')[1];

    $('edit').classList.add('hide');
    $('st').textContent = '⏳ Reading the form…';
    var pin = getPin();
    if (!pin) { $('st').textContent = '❌ PIN required'; $('edit').classList.remove('hide'); return; }
    fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ pin: pin, image: b64 }) })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (!r.ok) throw new Error(r.error);
        var data = r.data;
        $('st').textContent = '✅ Saved to Google Sheet';
        $('res').innerHTML = Object.keys(data).map(function (k) {
          return '<tr><td>' + k.replace(/_/g, ' ') + '</td><td>' + (data[k] || '') + '</td></tr>';
        }).join('');
        $('next').classList.remove('hide');
      })
      .catch(function (e) {
        if (/PIN/.test(e.message)) localStorage.removeItem('pin');
        $('st').textContent = '❌ ' + e.message;
        $('edit').classList.remove('hide');
      });
  }

  function back() {
    $('edit').classList.add('hide'); $('home').classList.remove('hide');
    $('st').textContent = ''; $('res').innerHTML = ''; $('next').classList.add('hide');
  }
</script>
</body>
</html>
